name: Discover underground repos

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/discover.py"
      - ".github/workflows/discover.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run discovery tests
        run: python -m unittest discover -s tests -v

      - name: Check browser JavaScript
        run: node --check app.js

      - name: Discover repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py

      - name: Open or update review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/developers.json; then
            echo "No repository changes found."
            exit 0
          fi

          BRANCH="automation/discovery"
          git config user.name "underground-github[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/developers.json
          git commit -m "Propose updated underground repos"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" -gt 0 ]; then
            echo "Updated the existing discovery pull request."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Review newly discovered repositories" \
              --body "Automated discovery update. Review category relevance and repository safety before merging."
          fi
